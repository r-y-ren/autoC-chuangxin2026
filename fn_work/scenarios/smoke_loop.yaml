# m1 竖切：六类样式快扫，双链路 KPI，出首张三元曲线
meta: {name: smoke_loop, version: 1}
dut: {links: [wifi, nrf24]}
injection:
  styles: [cw, sweep, chirp, noise_bandlimited, partial_band, pulse]
  freq_hz: 2422000000
  bandwidth_hz: 20000000
  params: {sweep_rate_hz_per_s: 1000000, chirp_period_s: 0.001, duty: 0.3, partial_band_frac: 0.25}
  power_start_db: -25
  power_step_db: 5
  power_stop_db: 0
  step_duration_s: 10
criteria: {per_threshold: 0.10, sustain_s: 10, disconnect_s: 30}
safety: {max_tx_gain_db: 0}
record: {sigmf: true, ch2_monitor: true}
